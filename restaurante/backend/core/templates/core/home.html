<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>La Terraza del Pri</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #000; /* Negro de fondo */
            color: #FFD700; /* Amarillo dorado */
        }

        header {
            background-color: #FFD700;
            color: #000;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 3em;
            letter-spacing: 2px;
        }

        nav {
            background-color: #111;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: #FFD700;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #fff;
        }

        .contenido {
            padding: 40px;
            text-align: center;
        }

        .contenido h2 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .contenido p {
            font-size: 1.2em;
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }

        footer {
            background-color: #111;
            color: #FFD700;
            text-align: center;
            padding: 15px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }

    </style>
</head>
<body>

    <header>
        <h1>La Terraza del Pri</h1>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Menú</a>
        <a href="#">Reservas</a>
        <a href="#">Contacto</a>
    </nav>

    <div class="contenido">
        <h2>Bienvenidos</h2>
        <p>En <strong>La Terraza del Pri</strong>, combinamos los mejores sabores con una experiencia inolvidable. ¡Descubre nuestro menú y disfruta de una velada única bajo las estrellas!</p>
    </div>

    <footer>
        © 2025 La Terraza del Pri. Todos los derechos reservados.
    </footer>

</body>
</html>
